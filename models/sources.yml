version: 2

sources:
  - name: raw
    database: quiet-seer-299408
    schema: gz_raw_data
    config:
      freshness:
        warn_after: {count: 90, period: day}
      loaded_at_field: date_date
    tables:
      - name: sales
        identifier: raw_gz_sales
        description: sales of Greenweez / we have one row per product_id found in each orders_id
        config:
          freshness:
            warn_after: {count: 90, period: day}
          loaded_at_field: date_date
        columns:
          - name: date_date
            description: date of purchase
          - name: orders_id
            description: foreign key to ship
          - name: pdt_id
            description: foreign key to product
          - name: revenue
            description: the amount paid by the customer to purchase the product. revenue = quantity * selling_price
          - name: quantity
            description: the quantity of products purchased for a given order
        tests:
          # Borra el test 'unique' manual con ||
          - dbt_utils.unique_combination_of_columns:
              arguments:
                combination_of_columns:
                  - orders_id
                  - pdt_id   

      - name: product
        identifier: raw_gz_product
        description: products of Greenweez
        columns:
          - name: products_id
            description: Primary key
          - name: purchSE_PRICE
            description: the purchase price of the product


      - name: ship
        identifier: raw_gz_ship
        description: shipping data for Greenweez orders
        columns:
          - name: orders_id
            description: Primary key
          - name: shipping_fee
            description: the price the customer pays for shipping
          - name: log_cost
            description: the cost of preparing the parcel in the distribution centre/warehouse
          - name: ship_cost
            description: shipping cost paid by Greenweez to the carrier/logistics provider
            tests:
              - not_null   


      - name: adwords
        identifier: raw_gz_adwords
        description: marketing adworks
        columns:
          - name: date_date
            description: date of the purchase
          - name: paid_source
            description: paid source  
          - name: campaign_key
            description: 
          - name: camPGN_name
            description: price of the purchase 
          - name: ads_cost
            description: 
          - name: impression
            description: 
          - name: click
            description: 


