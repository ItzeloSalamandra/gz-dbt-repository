version: 2

sources:
  - name: raw
    database: gz_raw_data
    schema: "{{ env_var('RAW_DATASET', 'gz_raw_data') }}"
    loader: bigquery
    description: ...
    config:
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: raw_gz_sales
        identifier: sales
      - name: raw_gz_product
        identifier: product
      - name: raw_gz_ship
        identifier: ship