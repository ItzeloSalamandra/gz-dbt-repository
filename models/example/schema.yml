version: 2

sources:
  - name: raw
    database: quiet-seer-299408
    schema: "{{ env_var('RAW_DATASET', 'gz_raw_data') }}"
    loader: bigquery
    description: adding tables
    config:
      freshness:
        warn_after: {count: 12, period: hour}
        error_after: {count: 24, period: hour}
    tables:
      - name: sales
        identifier: raw_gz_sales
      - name: product
        identifier: raw_gz_product
      - name: ship
        identifier: raw_gz_ship